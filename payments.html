<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tutoring Payments</title>

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

<!-- =======================
HEADER (unchanged)
======================= -->
<header class="site-header">
  <img src="images/Mathematics tutor promotion with call-to-action.png" alt="Math Tutor Banner">
</header>

<!-- =======================
PAYPAL UI
======================= -->
<div class="paycontainer">

  <select id="packageSelect">
    <option value="test">2 Half Hour TEST Session — $2.00</option>
    <option value="two">2 Half Hour Sessions — $75.00</option>
    <option value="ten">10 Half Hour Sessions — $350.00</option>
    <option value="twenty">20 Half Hour Sessions — $650.00</option>
  </select>

  <div id="paypal-button-container"></div>
</div>

<h2>Sessions: <span id="sessions">Loading...</span></h2>

<!-- =======================
PAYPAL SDK
======================= -->
<script src="https://www.paypal.com/sdk/js?client-id=AUMwMtXucbF0hp5UbnyclgPWeBUmzBpMLai9zxiwwJTkPSDkRgonjquFzHEfHUN6TH3O1bDvapgKXp7B&currency=USD"></script>

<script>
const API_BASE = "https://tutoring-backend-6fqf.onrender.com";

// =======================
// SESSION BOOTSTRAP (FIXED FLOW)
// =======================
async function bootstrapSession() {
  const res = await fetch(`${API_BASE}/api/session`, {
    credentials: "include"
  });

  const data = await res.json();
  console.log("Session initialized:", data);
}

// =======================
// LOAD SESSIONS
// =======================
async function loadSessions() {
  const res = await fetch(`${API_BASE}/sessions`, {
    credentials: "include"
  });

  const data = await res.json();

  document.getElementById("sessions").textContent = data.sessions;
}

// =======================
// PAYPAL FLOW
// =======================
paypal.Buttons({

  createOrder: async function () {

    const packageId = document.getElementById("packageSelect").value;

    const res = await fetch(`${API_BASE}/api/paypal/create-order`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ packageId })
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || "Unauthorized or server error");
    }

    return data.orderId;
  },

  onApprove: async function (data) {

    const res = await fetch(`${API_BASE}/api/paypal/capture-order`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ orderId: data.orderID })
    });

    const result = await res.json();

    if (result.success) {
      await loadSessions();
      alert("Payment successful");
    } else {
      alert("Payment failed");
    }
  },

  onError: function (err) {
    console.error(err);
    alert("PayPal error");
  }

}).render("#paypal-button-container");

// =======================
// INIT
// =======================
document.addEventListener("DOMContentLoaded", async () => {
  await bootstrapSession();
  await loadSessions();
});
</script>

</body>
</html>
